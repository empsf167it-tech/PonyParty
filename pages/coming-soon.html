<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Pony Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <style>
    .coming-soon-blobs {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .cs-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      animation: float 7s ease-in-out infinite;
    }
    .cs-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; text-align: center; padding: var(--space-12) var(--space-6); }
    .cs-pony { font-size: 6rem; animation: float 4s ease-in-out infinite; display: block; margin-bottom: var(--space-6); }
    .cs-notify-form {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-5);
      flex-wrap: wrap;
      justify-content: center;
    }
    .cs-notify-form input {
      flex: 1;
      min-width: 220px;
      max-width: 340px;
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      border: 1.5px solid var(--border-color);
      background: var(--bg-card);
      font-size: 0.95rem;
      color: var(--text-primary);
      font-family: var(--font-body);
      transition: border-color var(--transition-base);
    }
    .cs-notify-form input:focus { border-color: var(--primary); outline: none; }
    .cs-progress {
      width: 100%;
      max-width: 400px;
      height: 8px;
      background: var(--border-color);
      border-radius: var(--radius-full);
      margin: var(--space-8) auto var(--space-3);
      overflow: hidden;
    }
    .cs-progress-bar {
      height: 100%;
      width: 72%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: var(--radius-full);
      animation: progressLoad 2s ease forwards;
    }
    @keyframes progressLoad {
      from { width: 0; }
      to { width: 72%; }
    }
    .cs-socials {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      margin-top: var(--space-8);
    }
  </style>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>
<body>

  <main>
    <section class="coming-soon" style="min-height:100vh;background:var(--bg-primary);">
      <div class="coming-soon-blobs">
        <div class="cs-blob" style="width:700px;height:700px;background:var(--primary);top:-300px;right:-300px;"></div>
        <div class="cs-blob" style="width:500px;height:500px;background:var(--secondary);bottom:-200px;left:-200px;animation-delay:-3.5s;"></div>
        <div class="cs-blob" style="width:300px;height:300px;background:var(--accent);top:40%;left:40%;animation-delay:-1.5s;"></div>
      </div>

      <div class="container">
        <div class="cs-content">
          <span class="cs-pony">🐴</span>
          <span class="badge badge-secondary" style="margin-bottom:var(--space-4);">Trotting Soon</span>
          <h1 style="font-size:clamp(2.2rem, 5vw, 3.8rem);margin-bottom:var(--space-4);">Something Magical is On the Way</h1>
          <p style="font-size:1.15rem;max-width:560px;margin:0 auto var(--space-8);">We're galloping fast to bring you a brand-new experience. Sign up below to get notified when we launch!</p>

          <div class="cs-progress">
            <div class="cs-progress-bar"></div>
          </div>
          <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:var(--space-6);">Launch Progress: 72%</p>

          <!-- Notification Form -->
          <form class="cs-notify-form" onsubmit="event.preventDefault(); alert('Thank you! We will notify you when we launch.');">
            <input type="email" placeholder="Enter your email address" required aria-label="Email address for launch notification">
            <button type="submit" class="btn btn-primary btn-lg">Notify Me 🚀</button>
          </form>

          <!-- Socials -->
          <div class="cs-socials">
            <a href="#" class="btn-icon" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="btn-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="btn-icon" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="#" class="btn-icon" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
          </div>

          <p style="margin-top:var(--space-10);font-size:0.85rem;"><a href="../index.html" style="color:var(--primary);font-weight:600;">← Back to Main Site</a></p>
        </div>
      </div>
    </section>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
